name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-package:
    name: Package (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        variant: [static, shared]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.6"

      - name: Configure
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          cmake --preset ${{ matrix.variant }} -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMYTOML_INSTALL=ON \
            -DMYTOML_ENABLE_INSTALL=ON \
            -DMYTOML_ENABLE_PACKING=ON

      - name: Build
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          cmake --build "${BUILD_DIR}" --config Release

      - name: Install
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          INSTALL_DIR="install-${{ matrix.os }}-${{ matrix.variant }}"
          rm -rf "${INSTALL_DIR}"
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/${INSTALL_DIR}"

      - name: Package archives
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          INSTALL_DIR="install-${{ matrix.os }}-${{ matrix.variant }}"
          DIST_DIR="dist/${{ matrix.os }}-${{ matrix.variant }}"
          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          cpack --config "${BUILD_DIR}/CPackConfig.cmake" \
            -D CPACK_GENERATOR='ZIP;TGZ' \
            -B "${PWD}/${DIST_DIR}"

          INSTALL_ARCHIVE="mytoml-${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.variant }}-install.zip"
          cmake -E tar cfv "${DIST_DIR}/${INSTALL_ARCHIVE}" --format=zip "${INSTALL_DIR}"

          echo "Packaged files:"
          find "${DIST_DIR}" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.variant }}
          if-no-files-found: error
          path: dist/${{ matrix.os }}-${{ matrix.variant }}/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-package

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        run: |
          mapfile -t RELEASE_FILES < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release archives found in artifacts directory"
            exit 1
          fi

          sha256sum "${RELEASE_FILES[@]}" > artifacts/SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
