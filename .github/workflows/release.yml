name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-package:
    name: Package (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        variant: [static, shared]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.6"

      - name: Configure
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          cmake --preset ${{ matrix.variant }} -B "${BUILD_DIR}"\
            -DCMAKE_BUILD_TYPE=Release \
            -DMYTOML_INSTALL=ON \
            -DMYTOML_ENABLE_INSTALL=ON \
            -DMYTOML_ENABLE_PACKING=ON

      - name: Build
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          cmake --build "${BUILD_DIR}" --config Release

      - name: Install
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          INSTALL_DIR="install-${{ matrix.os }}-${{ matrix.variant }}"
          rm -rf "${INSTALL_DIR}"
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/${INSTALL_DIR}"

      - name: Create CPack archives
        run: |
          BUILD_DIR="build-${{ matrix.os }}-${{ matrix.variant }}"
          cpack --config "${BUILD_DIR}/CPackConfig.cmake" -D CPACK_GENERATOR='ZIP;TGZ'

      - name: Archive install tree
        run: |
          INSTALL_DIR="install-${{ matrix.os }}-${{ matrix.variant }}"
          INSTALL_ARCHIVE="mytoml-${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.variant }}-install.zip"
          cmake -E tar cfv "${INSTALL_ARCHIVE}" --format=zip "${INSTALL_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            mytoml-${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.variant }}-install.zip
            build-${{ matrix.os }}-${{ matrix.variant }}/*.zip
            build-${{ matrix.os }}-${{ matrix.variant }}/*.tar.gz

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-package

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | while IFS= read -r -d '' f; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
