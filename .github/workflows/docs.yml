name: Docs

on:
  push:
    branches: [main, dev]
    paths:
      - docs/mkdocs/**
      - .github/workflows/docs.yml

  pull_request:
    branches: [main, dev]
    paths:
      - docs/mkdocs/**
      - .github/workflows/docs.yml

  workflow_dispatch:

# we don't want to have concurrent jobs, and we don't want to cancel running jobs to avoid broken publications
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    name: Build docs

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./docs/mkdocs

    if: github.repository == 'djoezeke/mytoml'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/mkdocs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build distributions & Docs
        run: mkdocs build --strict

      - name: Publish documentation 📚 to GitHub Pages
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
        env:
          # This token is automatically provided by GitHub Actions
          # and has the necessary permissions to push to gh-pages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
